// ============================================================
//  OVERDUE ALERTS — while the app is open (in front or in the background)
// ============================================================
const NOTIF_OK='Notification' in window&&'serviceWorker' in navigator;
const OVERDUE_WHAT={overdueFiles:'file',overdueTasks:'task',materialsOverdue:'material'};
function alertStateLabel(){
    if(!NOTIF_OK)return'';
    return Notification.permission==='granted'?'On':Notification.permission==='denied'?'Blocked':'Off';
}
function updateAlertState(){
    const el=document.getElementById('alertState');if(!el||!NOTIF_OK)return;
    el.textContent=alertStateLabel();
    el.className='menu-badge '+(Notification.permission==='granted'?'on':'off');
}
// Short two-tone chime. Browsers only allow sound after the user has tapped the page,
// so the audio engine is unlocked on the first tap.
// Created on first use (browsers allow sound once the user has tapped the page at least once)
let _audio=null;
function playChime(){
    if(!_audio){
        if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;
        try{_audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    }
    try{
        if(_audio.state==='suspended')_audio.resume();
        const t=_audio.currentTime;
        [[880,0],[660,0.22],[880,0.44]].forEach(([f,d])=>{
            const o=_audio.createOscillator(),g=_audio.createGain();
            o.type='sine';o.frequency.value=f;
            g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.35,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2);
            o.connect(g).connect(_audio.destination);o.start(t+d);o.stop(t+d+0.22);
        });
    }catch(e){}
}
function overdueLine({item,key}){
    const what=OVERDUE_WHAT[key]||'entry';
    const title=item.title&&item.title!=='Image Captured'?` (${item.title})`:item.taskType?` (${label(item.taskType)})`:'';
    return key==='overdueTasks'?`${item.name||'Task'}${title} — deadline has passed`:`${item.name||'Someone'}${title} — return the ${what}`;
}
let _pendingAlerts=[];
document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&_pendingAlerts.length){const m=_pendingAlerts;_pendingAlerts=[];alertOverdue(m);}
});
// Called with the entries that just became overdue
async function alertOverdue(moved){
    const first=moved[0],what=OVERDUE_WHAT[first.key]||'entry';
    const title=moved.length===1?`⏰ ${what[0].toUpperCase()+what.slice(1)} overdue`:`⏰ ${moved.length} entries overdue`;
    const body=moved.slice(0,3).map(overdueLine).join('\n')+(moved.length>3?`\n+${moved.length-3} more`:'');
    const openKey=moved.every(m=>m.key===first.key)?first.key:'overdueFiles';
    if(document.visibilityState==='visible'){
        // App on screen: in-app alert + chime + vibration
        playChime();
        if(navigator.vibrate)navigator.vibrate([250,120,250]);
        if(document.getElementById('entryPopup').classList.contains('active')||document.getElementById('confirmPopup').classList.contains('active')){
            toast(title+' — '+overdueLine(first),'error');return;
        }
        showEntryPopup(`<div style="text-align:center"><div style="font-size:44px;margin-bottom:6px">⏰</div><h2 class="popup-title">${esc(title.replace(/^⏰\s*/,''))}</h2></div>
<div class="kv">${moved.slice(0,5).map(m=>`<div class="kv-row"><strong style="text-align:left">${esc(overdueLine(m))}</strong></div>`).join('')}${moved.length>5?`<div class="kv-row"><span>+${moved.length-5} more</span></div>`:''}</div>
<div class="popup-actions"><button class="popup-cancel" onclick="closePopup()">OK</button><button class="popup-confirm" onclick="closePopup();openOverdueList('${openKey}')">View</button></div>`,false);
        return;
    }
    // App in the background: phone notification (the phone plays its notification tone).
    // Without permission, keep them and show the in-app alert when the user comes back.
    if(!NOTIF_OK||Notification.permission!=='granted'){_pendingAlerts.push(...moved);return;}
    try{
        const reg=await navigator.serviceWorker.ready;
        await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'overdue-'+Date.now(),
            renotify:true,requireInteraction:true,vibrate:[250,120,250],data:{openKey}});
    }catch(e){console.warn('Notification failed',e);}
}
// Open the right dashboard + overdue list (from the alert popup or a notification tap)
function openOverdueList(key){
    if(!OVERDUE_TYPES.includes(key))key='overdueFiles';
    closeTopOverlay();
    const mode=key==='overdueTasks'?['office','assignedTask']:key==='materialsOverdue'?['office','picture']:['fileMovement',curMode==='fileMovement'?curType:'picture'];
    if(navStack.length)closeAllViews();
    selectMode(mode[0],mode[1]);
    openDetailView(key);
}
async function requestAlerts(){
    if(!NOTIF_OK)return;
    try{await Notification.requestPermission();}catch(e){}
    updateAlertState();
    if(Notification.permission==='granted'){
        toast('🔔 Overdue alerts are on','success');
        try{(await navigator.serviceWorker.ready).showNotification('🔔 Muhafiz alerts are on',{body:'You will be notified when a file, material or task becomes overdue while the app is open.',icon:'icon-192.png',badge:'icon-192.png',tag:'alerts-on'});}catch(e){}
    }else if(Notification.permission==='denied')toast('Notifications are blocked — enable them in phone settings','error');
}
// Ask once, right after the first entry is saved (a natural moment, and a user action)
function maybeAskForAlerts(){
    if(!NOTIF_OK||Notification.permission!=='default'||cacheGet('alertsAsked'))return;
    if(document.getElementById('entryPopup').classList.contains('active'))return;
    dbSet('alertsAsked','1').catch(console.error);
    showEntryPopup(`<div style="text-align:center"><div style="font-size:44px;margin-bottom:6px">🔔</div><h2 class="popup-title">Turn on overdue alerts?</h2></div>
<p class="popup-sub">Get a notification and tone when a file, material or task becomes overdue while the app is open.</p>
<div class="popup-actions"><button class="popup-cancel" onclick="closePopup()">Not now</button><button class="popup-confirm" onclick="closePopup();requestAlerts()">Turn on</button></div>`,false);
}
function openAlertSettings(){
    closeSidebar();
    if(Notification.permission==='default'){requestAlerts();return;}
    const on=Notification.permission==='granted';
    showEntryPopup(`<div style="text-align:center"><div style="font-size:44px;margin-bottom:6px">${on?'🔔':'🔕'}</div><h2 class="popup-title">Overdue Alerts: ${on?'On':'Blocked'}</h2></div>
${on?`<p class="popup-sub">When an entry becomes overdue:<br>• App on screen → alert with tone &amp; vibration<br>• App in background → phone notification</p>
<p class="popup-sub"><strong>Note:</strong> if the app is fully closed, alerts appear the next time you open it.</p>
<div class="popup-actions"><button class="popup-cancel" onclick="closePopup()">Close</button><button class="popup-confirm" onclick="testAlert()">Test alert</button></div>`
:`<p class="popup-sub">Notifications were blocked for this app. To turn them on:</p>
<div class="kv"><div class="kv-row"><span>1.</span><strong>Phone Settings → Apps → Muhafiz (or Chrome)</strong></div><div class="kv-row"><span>2.</span><strong>Notifications → Allow</strong></div></div>
<div class="popup-actions"><button class="popup-confirm" onclick="closePopup()">OK</button></div>`}`,false);
}
async function testAlert(){
    closePopup();
    playChime();if(navigator.vibrate)navigator.vibrate([250,120,250]);
    try{(await navigator.serviceWorker.ready).showNotification('⏰ Test: File overdue',{body:'This is how an overdue alert looks.',icon:'icon-192.png',badge:'icon-192.png',tag:'test',vibrate:[250,120,250],data:{openKey:'overdueFiles'}});}catch(e){toast('Could not show notification','error');}
}

// ============================================================
//  INSTALL APP (PWA)
// ============================================================
// True when running as an installed app (home-screen PWA, fullscreen, or Play Store TWA)
function isAppInstalled(){
    return ['standalone','fullscreen','minimal-ui'].some(m=>window.matchMedia(`(display-mode: ${m})`).matches)
        ||navigator.standalone===true||document.referrer.startsWith('android-app://');
}
const UA=navigator.userAgent;
const IS_IOS=/iphone|ipad|ipod/i.test(UA);
const IS_ANDROID=/android/i.test(UA);
// Real Chrome (not WebView / WhatsApp / Facebook in-app browser / other browsers)
const IS_CHROME=/Chrome\/\d/.test(UA)&&!/; wv\)|EdgA|SamsungBrowser|OPR|YaBrowser|FBAN|FBAV|Instagram|Line\//.test(UA);
function setupInstall(){
    window.addEventListener('appinstalled',()=>{
        window.__installPrompt=null;
        const sec=document.getElementById('installSection');if(sec)sec.hidden=true;
        closePopup();
        toast('✓ App installed — open it from your home screen','success');
    });
}
// Wait briefly for Chrome's install event (if the button is tapped right after opening)
function waitForInstallPrompt(ms){
    if(window.__installPrompt)return Promise.resolve(window.__installPrompt);
    return new Promise(res=>{
        const done=()=>{clearTimeout(t);window.removeEventListener('muhafiz-installable',done);res(window.__installPrompt);};
        const t=setTimeout(done,ms);
        window.addEventListener('muhafiz-installable',done);
    });
}
async function installApp(){
    closeSidebar();
    if(isAppInstalled()){toast('App is already installed','success');return;}
    if(!window.__installPrompt&&!IS_IOS){showLoading('Preparing install...');await waitForInstallPrompt(2500);hideLoading();}
    const ev=window.__installPrompt;
    if(ev){
        try{
            await ev.prompt();  // Chrome's own "Install app" popup
            const{outcome}=await ev.userChoice;
            window.__installPrompt=null;  // an install prompt can only be used once
            if(outcome!=='accepted')toast('Install cancelled — you can install any time from the menu');
        }catch(e){showInstallHelp();}
        return;
    }
    showInstallHelp();
}
// Opens this same page in Chrome (Android intent link) — used when inside WhatsApp etc.
function openInChrome(){
    location.href=`intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;end`;
}
function showInstallHelp(){
    const step=(n,t)=>`<div class="kv-row"><span>${n}.</span><strong>${t}</strong></div>`;
    let body;
    if(IS_IOS){
        body=`<p class="popup-sub">On iPhone, apps are installed from Safari:</p><div class="kv">${step(1,'Open this page in Safari')}${step(2,'Tap Share ⬆️ at the bottom')}${step(3,'Tap "Add to Home Screen"')}</div>`;
    }else if(IS_ANDROID&&!IS_CHROME){
        body=`<p class="popup-sub">This page is open inside another app. Open it in Chrome to install:</p>
<div class="popup-actions stack"><button class="popup-confirm" onclick="openInChrome()">🌐 Open in Chrome</button></div>
<p class="popup-sub" style="margin-top:12px">Then tap <strong>☰ → 📲 Install App</strong> again.</p>`;
    }else{
        body=`<p class="popup-sub">Chrome did not offer the install popup. The app may <strong>already be installed</strong> — check your home screen and app list for "Muhafiz".</p>
<p class="popup-sub">Otherwise install it from Chrome's menu:</p><div class="kv">${step(1,'Tap the ⋮ menu (top right)')}${step(2,'Tap "Install app" or "Add to Home screen"')}</div>`;
    }
    showEntryPopup(`<h2 class="popup-title">📲 Install App</h2>${body}
<div class="popup-actions"><button class="popup-cancel" onclick="closePopup()">Close</button></div>`,false);
}

// ============================================================
//  IMPORT / EXPORT
// ============================================================
const BACKUP_REMIND_DAYS=7;
// Ask the browser not to auto-clear our storage when the phone runs low on space
async function requestPersistentStorage(){
    try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}
    catch(e){console.warn('Persistent storage request failed',e);}
}
function hasAnyData(){return DATA_KEYS.some(k=>{const v=cacheGet(k);return v&&v!=='[]';});}
function daysSinceBackup(){const l=cacheGet('lastBackupAt');return l?Math.floor((Date.now()-new Date(l))/86400000):null;}
function lastBackupText(){
    const d=daysSinceBackup();
    if(d===null)return'⚠ No backup taken yet';
    return`Last backup: ${d===0?'today':d===1?'yesterday':plural(d,'day')+' ago'}`;
}
function updateBackupBanner(){
    const el=document.getElementById('backupBanner');if(!el)return;
    const d=daysSinceBackup(),snoozed=Date.now()<+(cacheGet('backupSnoozeUntil')||0);
    const show=hasAnyData()&&!snoozed&&(d===null||d>=BACKUP_REMIND_DAYS);
    el.innerHTML=show?`<div class="backup-banner" role="alert"><div><strong>💾 Backup reminder</strong><span>${d===null?'You have not taken any backup yet.':`Your last backup was ${plural(d,'day')} ago.`} If this phone is lost or reset, your data cannot be recovered.</span></div>
<div class="bb-actions"><button class="bb-primary" onclick="openBackup()">Backup Now</button><button class="bb-later" onclick="snoozeBackup()">Later</button></div></div>`:'';
    const lt=document.getElementById('lastBackupText');if(lt)lt.textContent=lastBackupText();
}
function snoozeBackup(){dbSet('backupSnoozeUntil',String(Date.now()+86400000)).catch(console.error);updateBackupBanner();}
// Backups keep the photos inside the file (same format as older versions), so a backup
// restores on any version and on any phone
async function backupJSON(){
    const data={app:'Muhafiz',exportDate:new Date().toISOString()};
    const inline=async o=>{
        if(o&&o.imageId){const{imageId,...rest}=o;rest.image=(await getImages([imageId]))[0]||null;return rest;}
        if(o&&Array.isArray(o.imageIds)){const{imageIds,...rest}=o;rest.images=(await getImages(imageIds)).filter(Boolean);if(o.caseType==='picture')rest.hasImages=true;return rest;}
        return o;
    };
    for(const k of DATA_KEYS){
        const list=getArr(k);
        data[k]=k==='englishFile_folders'?await Promise.all(list.map(async f=>({...f,documents:await Promise.all((f.documents||[]).map(inline))})))
            :k==='record_folders'?await Promise.all(list.map(async f=>({...f,cases:await Promise.all((f.cases||[]).map(inline))})))
            :await Promise.all(list.map(inline));
    }
    return JSON.stringify(data);
}
async function markBackupDone(){
    try{await dbSet('lastBackupAt',new Date().toISOString());}catch(e){console.error(e);}
    updateBackupBanner();
}
function openBackup(){
    closeSidebar();
    showEntryPopup(`<h2 class="popup-title">💾 Backup</h2>
<p class="popup-sub">${lastBackupText()}<br><span id="storageInfo"></span></p>
<p class="popup-sub">Save the backup outside this phone — e.g. send it to your own WhatsApp or save it to Google Drive.</p>
<div class="popup-actions stack">
    ${navigator.share?'<button class="popup-confirm" onclick="shareBackup()">📤 Share Backup (WhatsApp / Drive)</button>':''}
    <button class="popup-confirm${navigator.share?' violet':''}" onclick="downloadBackup()">⬇️ Download Backup File</button>
    <button class="popup-cancel" onclick="closePopup()">Cancel</button>
</div>`,false);
    if(navigator.storage&&navigator.storage.estimate){
        navigator.storage.estimate().then(e=>{const el=document.getElementById('storageInfo');if(el&&e.usage)el.textContent=`Data size: ${(e.usage/1048576).toFixed(1)} MB`;}).catch(()=>{});
    }
}
async function shareBackup(){
    const name=`muhafiz-backup-${todayISO()}`;
    showLoading('Preparing backup...');
    let json;
    try{json=await backupJSON();}catch(e){hideLoading();toast('Backup failed: '+e.message,'error');return;}
    hideLoading();
    // Some Android versions only allow sharing .txt files; restore accepts both
    let file=new File([json],name+'.json',{type:'application/json'});
    if(!(navigator.canShare&&navigator.canShare({files:[file]})))file=new File([json],name+'.txt',{type:'text/plain'});
    if(!(navigator.canShare&&navigator.canShare({files:[file]}))){toast('Sharing files is not supported here — use Download','error');return;}
    try{
        await navigator.share({files:[file],title:'Muhafiz Backup'});
        closePopup();await markBackupDone();toast('✓ Backup shared','success');
    }catch(e){
        if(e.name==='NotAllowedError'){offerShare(file);return;}  // took too long after the tap — ask for one more tap
        if(e.name!=='AbortError')toast('Share failed: '+e.message,'error');
    }
}
function offerShare(file){
    showEntryPopup(`<h2 class="popup-title">💾 Backup ready</h2><p class="popup-sub">Tap Share to send it to WhatsApp or Google Drive.</p>
<div class="popup-actions"><button class="popup-cancel" onclick="closePopup()">Cancel</button><button class="popup-confirm" id="shareReadyBtn">📤 Share</button></div>`,false);
    document.getElementById('shareReadyBtn').onclick=async()=>{
        try{await navigator.share({files:[file],title:'Muhafiz Backup'});closePopup();await markBackupDone();toast('✓ Backup shared','success');}
        catch(e){if(e.name!=='AbortError')toast('Share failed: '+e.message,'error');}
    };
}
async function downloadBackup(){
    showLoading('Preparing backup...');
    try{
        const blob=new Blob([await backupJSON()],{type:'application/json'});
        hideLoading();
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=`muhafiz-backup-${todayISO()}.json`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        closePopup();await markBackupDone();toast('✓ Backup downloaded','success');
    }catch(e){hideLoading();toast('Backup failed: '+e.message,'error');}
}
function importData(){closeSidebar();document.getElementById('importFileInput').click();}
function handleImportFile(e){
    const file=e.target.files[0];e.target.value='';
    if(!file)return;
    const reader=new FileReader();
    reader.onerror=()=>toast('Could not read the file','error');
    reader.onload=ev=>{
        let data;
        try{data=JSON.parse(ev.target.result);}catch(_){toast('Invalid file format!','error');return;}
        if(!data||typeof data!=='object'||Array.isArray(data)){toast('Invalid file format!','error');return;}
        const keys=DATA_KEYS.filter(k=>Array.isArray(data[k]));
        if(!keys.length){toast('No Muhafiz data found in this file','error');return;}
        const when=data.exportDate?` (backup from ${fmtDate(data.exportDate)})`:'';
        showConfirmPopup('Import Data',`This will replace your current data${when}. Continue?`,async()=>{
            showLoading('Importing data...');
            try{
                const picked={};keys.forEach(k=>{picked[k]=data[k];});
                const{out,photos}=splitPhotos(picked,false);
                await putPhotoRecords(photos);  // photos first, then the lists that point to them
                for(const k of keys)await setArr(k,out[k]||picked[k]);
                await migratePhotosOnce();  // no-op normally; finishes any lists not in the backup
                cleanUnusedPhotos().catch(console.error);  // photos of the replaced data
                await runOverdueChecks();
                loadCounts();toast('✓ Data imported successfully','success');
            }catch(err){toast('Import failed: '+err.message,'error');}
            finally{hideLoading();}
        },false,{confirmText:'Import',danger:true});
    };
    reader.readAsText(file);
}

// ============================================================
//  SERVICE WORKER
// ============================================================
// The app opens instantly from the phone's saved copy; a newer version is downloaded
// in the background and the user is offered a one-tap update.
function applyUpdate(){
    document.body.classList.add('leaving');  // fade to the background, then load the new version
    setTimeout(()=>location.reload(),180);
}
function showUpdateBar(){
    if(document.getElementById('updateBar'))return;
    const bar=document.createElement('div');
    bar.id='updateBar';bar.className='update-bar';bar.setAttribute('role','status');
    bar.innerHTML='<span>🔄 A new version of the app is ready</span><button onclick="applyUpdate()">Update</button><button class="ub-close" onclick="this.parentElement.remove()" aria-label="Later">×</button>';
    document.body.appendChild(bar);
}
if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',e=>{
        if(!e.data)return;
        if(e.data.type==='APP_UPDATED')showUpdateBar();
        if(e.data.type==='OPEN_OVERDUE')openOverdueList(e.data.key);
    });
    navigator.serviceWorker.startMessages();  // receive messages sent while the page is still loading
    window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('SW registration failed:',err));
    });
}
</script>
